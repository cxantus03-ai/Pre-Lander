<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allpure Quiz</title>

<style>
  /* ============================================================
     Octane AI fullscreen quiz — close (X) button, top-right
     ------------------------------------------------------------
     In fullscreen mode Octane renders the close button as the
     first element inside .oct-quiz-content, inside the
     .octane-ai-quiz-rendered wrapper. The rules below target it
     a few different ways so they hold up even if Octane tweaks
     the exact markup.

     TWO OPTIONS — Option A is active. To switch, comment out
     Option A and uncomment Option B.
     ============================================================ */

  /* ---- OPTION A: REMOVE the X entirely (active) ---- */
  .octane-ai-quiz-rendered [class*="close" i],
  .octane-ai-quiz-rendered [aria-label*="close" i],
  .octane-ai-quiz-rendered [data-testid*="close" i],
  .octane-ai-quiz-rendered .oct-quiz-content > button:first-child,
  .octane-ai-quiz-rendered .oct-quiz-content > *:first-child button {
    display: none !important;
  }

  /* ---- OPTION B: keep the X but make it WHITE ----
  .octane-ai-quiz-rendered [class*="close" i],
  .octane-ai-quiz-rendered [aria-label*="close" i],
  .octane-ai-quiz-rendered [data-testid*="close" i],
  .octane-ai-quiz-rendered [class*="close" i] svg,
  .octane-ai-quiz-rendered [aria-label*="close" i] svg,
  .octane-ai-quiz-rendered [class*="close" i] svg path,
  .octane-ai-quiz-rendered [aria-label*="close" i] svg path {
    color: #fff !important;
    fill: #fff !important;
    stroke: #fff !important;
    opacity: 1 !important;
  }
  */
</style>
</head>
<body>

<div class="octane-ai-quiz " data-quiz-id="jS3zsgA4WFtk8WgD" data-embed-type="fullscreen"  >

</div>
<script src="https://app.octaneai.com/8k7ygh7ywl89mr9u/quiz.js" defer></script>

</body>
</html>
