<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Find Your Match — Allpure</title>
<style>
  /* Let the quiz fill the full browser height so match_browser has room to work */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
  }
  body {
    overflow: hidden;               /* the quiz manages its own scrolling */
    background: #faf7ef;
    -webkit-text-size-adjust: 100%;
  }
  .octane-ai-quiz {
    width: 100%;
    height: 100%;
    height: 100dvh;                 /* true viewport height on mobile browsers */
  }
</style>
</head>
<body>

<div class="octane-ai-quiz"
     data-quiz-id="jS3zsgA4WFtk8WgD"
     data-embed-type="fullpage"
     data-mobile-height="match_browser"
     data-desktop-height="match_browser"></div>
<script src="https://app.octaneai.com/8k7ygh7ywl89mr9u/quiz.js" defer></script>

</body>
</html>
